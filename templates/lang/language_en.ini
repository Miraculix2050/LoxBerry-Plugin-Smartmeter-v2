VZLOGGER_TEXT="Enable vzLogger, configure reading heads, meters and channels, then use “Save and apply”. Start, Stop and Restart are temporary runtime actions and do not change the saved activation state. The SmartMeter bridge for MQTT, HTTP cache, and UDP is optional."
OBIS_TITLE="Reading heads and OBIS channels"
OBIS_TEXT="The reading-head scan adds newly detected devices. OBIS discovery uses the current settings of the selected reading head and stores its detected identifiers in the background. Use “Save and apply” to make channel selections part of the active runtime configuration."
