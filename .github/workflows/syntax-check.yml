name: Automated regression suite

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  syntax-check:
    name: Perl and PHP syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install syntax check dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo find /etc/apt/sources.list.d \
            -type f \( -iname '*microsoft*' -o -iname '*azure*' \) \
            -delete
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libconfig-crontab-perl \
            libconfig-simple-perl \
            libcgi-pm-perl \
            libdatetime-perl \
            libdevice-serialport-perl \
            libfile-homedir-perl \
            libhtml-template-perl \
            libjson-perl \
            php-cli

      - name: Set up Node.js for browser-model tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Keep the job name stable because branch protection may require it.
      - name: Run complete syntax and regression suite
        shell: pwsh
        run: ./tools/test.ps1 -Profile Full
